; Vidéos des annonces : 100 Mo au plus (StockageMedias) ; un peu de marge pour l'en-tête de la requête.
upload_max_filesize = 110M
post_max_size = 110M
memory_limit = 256M
; Annonce vocale : la transcription d'un enregistrement de 3 minutes peut prendre plus d'une minute.
max_execution_time = 300
expose_php = Off
