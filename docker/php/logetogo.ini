; Vidéos des annonces : 100 Mo au plus (avec un peu de marge).
upload_max_filesize = 110M
post_max_size = 110M
memory_limit = 256M

; Annonce vocale : la transcription peut prendre plus d'une minute.
max_execution_time = 300

; Ne pas révéler la version de PHP dans les réponses.
expose_php = Off

; OPcache : PHP garde le code compilé en mémoire.
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; En production le code ne change pas dans l'image : inutile de vérifier les fichiers à chaque requête.
opcache.validate_timestamps = 0