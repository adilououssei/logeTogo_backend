server {
    listen 80;
    root /var/www/html/public;

    # Vidéos des annonces : 100 Mo au plus.
    client_max_body_size 110M;
    server_tokens off;

    # Fichier existant (image, CSS…) : Nginx le sert lui-même. Sinon : Symfony.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Transmission à PHP-FPM, dans le conteneur nommé « php », port 9000.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 300s;
        internal;
    }

    # Aucun autre fichier .php ne doit être
    location ~ \.php$ {
        return 404;
    }
}