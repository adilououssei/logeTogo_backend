# API et administration LogeTogo : Nginx sert les fichiers publics et transmet le PHP au conteneur
# « backend » (PHP-FPM). Le HTTPS est assuré par le Nginx du VPS, devant ce conteneur.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Vidéos des annonces : 100 Mo au plus.
    client_max_body_size 110M;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Photos, vidéos et avatars envoyés par les utilisateurs, et assets compilés : mis en cache.
    location ^~ /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Annonce vocale (transcription) : réponse parfois longue.
        fastcgi_read_timeout 300s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/logetogo_access.log;
    error_log /var/log/nginx/logetogo_error.log;
}
