# Site LogeTogo pour le Nginx du VPS (à copier dans /etc/nginx/sites-available/, voir DEPLOIEMENT.md).
# Certbot y ajoute ensuite le HTTPS et la redirection depuis le HTTP.
server {
    listen 80;
    server_name logetogo.zonalchd.org;

    # Vidéos des annonces : 100 Mo au plus.
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Annonce vocale : la transcription peut prendre plus d'une minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
